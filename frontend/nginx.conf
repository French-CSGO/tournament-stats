server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://tournament-backend:3001/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 500m;
    }

    # Page SPA « démos d'une saison » : servie par Vue, pas par le backend
    # (sinon un accès direct à /demos/season/:id part en proxy → 404)
    location /demos/season/ {
        try_files $uri /index.html;
    }

    location /demos/ {
        proxy_pass http://tournament-backend:3001/demos/;
    }
}
